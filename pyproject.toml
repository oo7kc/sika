[project]
name = "fx-pred"
version = "0.1.0"
description = "Machine Learning with Technical Indicators for Financial Market Trend Prediction"
readme = "README.md"
requires-python = "==3.12.9"
dependencies = [
    "dotenv==0.9.9",
    "joblib==1.5.3",
    "metatrader5==5.0.6231; sys_platform == 'win32'",
    "numpy==2.3.4",
    "pandas==2.3.3",
    "requests==2.33.1",
    "rich==14.2.0",
    "scikit-learn==1.7.2",
    "ta-lib==0.6.8",
]

[project.scripts]
sika-mt5-probe = "sika.market_data.mt5_probe:main"
sika-mt5-validate-backfill = "sika.market_data.mt5_backfill:main"
sika-mt5-validate-export = "sika.market_data.mt5_export:main"

[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["sika*"]
