[project]
name = "sika-trade-planner"
version = "0.1.0"
description = "Research-validated XAUUSD trade-plan tooling"
readme = "README.md"
requires-python = "==3.12.9"
dependencies = []

[project.optional-dependencies]
windows-mt5 = [
    "metatrader5==5.0.6231; sys_platform == 'win32'",
]

[project.scripts]
sika-mt5-probe = "sika.market_data.mt5_probe:main"
sika-mt5-reconcile-gaps = "sika.market_data.mt5_gap_reconciliation:main"
sika-mt5-validate-backfill = "sika.market_data.mt5_backfill:main"
sika-mt5-validate-export = "sika.market_data.mt5_export:main"

[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["sika*"]

[tool.ruff]
target-version = "py312"
line-length = 88
exclude = ["archive"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
